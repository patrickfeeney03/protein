## SQLite
spring.datasource.url=${SQLITE_JDBC_URL:jdbc:sqlite:/var/lib/demo/app.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# create and drop table, good for testing, production set to none or comment it
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
app.security.cookies.secure=true
app.auth.require-remember-me-key=true
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:https://proteinpereuro.ie/api/auth/google/callback}
app.nutrition-scanner.validate-image-signature=true
app.security.origin-verification.header-name=${ORIGIN_VERIFY_HEADER:X-Origin-Shared-Secret}
app.security.origin-verification.shared-secret=${ORIGIN_SHARED_SECRET:}
app.security.origin-verification.enabled=${ORIGIN_VERIFY_ENABLED:true}
app.security.origin-verification.enforce=${ORIGIN_VERIFY_ENFORCE:true}

logging.level.root=INFO
logging.level.com.example.demo=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

## CORS — comma-separated frontend origins allowed (set to your frontend URL in production)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

## trusted reverse proxy — extract real client IP from forwarded header
## comment out if the app is directly internet-facing
app.rate-limit.forwarded-header=${FORWARDED_HEADER:X-Client-IP}
app.rate-limit.require-trusted-proxy=true
app.rate-limit.trusted-proxy-cidrs=${TRUSTED_PROXY_CIDRS:}
