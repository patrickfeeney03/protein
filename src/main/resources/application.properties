spring.application.name=demo
server.port=${SERVER_PORT:${PORT:8080}}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

## request/error logs — requestId is set by RequestLoggingFilter
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{requestId:-}] --- [%15.15t] %-40.40logger{39} : %m%n
logging.level.root=INFO
logging.level.com.example.demo=INFO

## default database connection (SQLite)
spring.datasource.url=${SQLITE_JDBC_URL:jdbc:sqlite:/home/patrick/code/protein/protein/data/app-dev.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

## default connection pool
spring.datasource.hikari.connectionTimeout=5000
spring.datasource.hikari.maximumPoolSize=10


## app config
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

## CORS — comma-separated frontend origins allowed (Angular dev default: http://localhost:4200)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

## rate limiting
app.rate-limit.food-create.capacity=30
app.rate-limit.food-create.window=PT1H
app.rate-limit.food-create-cooldown.capacity=1
app.rate-limit.food-create-cooldown.window=PT5S
app.rate-limit.comment-create.capacity=30
app.rate-limit.comment-create.window=PT1H
app.rate-limit.comment-create-cooldown.capacity=1
app.rate-limit.comment-create-cooldown.window=PT4S
app.rate-limit.auth-post.capacity=20
app.rate-limit.auth-post.window=PT15M
app.rate-limit.auth-post-cooldown.capacity=1
app.rate-limit.auth-post-cooldown.window=PT5S
app.rate-limit.scan-image.capacity=10
app.rate-limit.scan-image.window=PT1H
app.rate-limit.scan-image-cooldown.capacity=1
app.rate-limit.scan-image-cooldown.window=PT10S
app.rate-limit.scan-image-daily.capacity=${OCR_DAILY_CAPACITY:25}
app.rate-limit.scan-image-daily.window=${OCR_DAILY_WINDOW:P1D}
app.rate-limit.scan-image-max-concurrency=${OCR_MAX_CONCURRENCY_PER_ACCOUNT:1}
app.rate-limit.scan-image-global-max-concurrency=${OCR_MAX_CONCURRENCY_GLOBAL:4}

## Google OAuth (real values come from environment variables)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-dev-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-dev-placeholder}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}
app.auth.google.success-redirect=${GOOGLE_SUCCESS_REDIRECT:/}
app.auth.google.failure-redirect=${GOOGLE_FAILURE_REDIRECT:/login?error=oauth}

## remember-me
app.auth.remember-me-key=${REMEMBER_ME_KEY:}
app.auth.require-remember-me-key=${REQUIRE_REMEMBER_ME_KEY:false}

## browser/security controls
app.security.cookies.secure=${COOKIE_SECURE:false}
app.security.origin-verification.header-name=${ORIGIN_VERIFY_HEADER:X-Origin-Shared-Secret}
app.security.origin-verification.shared-secret=${ORIGIN_SHARED_SECRET:}
app.security.origin-verification.enabled=${ORIGIN_VERIFY_ENABLED:false}
app.security.origin-verification.enforce=${ORIGIN_VERIFY_ENFORCE:false}

## nutrition scanner
app.nutrition-scanner.base-url=${MISTRAL_BASE_URL:https://api.mistral.ai}
app.nutrition-scanner.api-key=${MISTRAL_API_KEY:}
app.nutrition-scanner.model=${MISTRAL_OCR_MODEL:mistral-ocr-latest}
app.nutrition-scanner.timeout=${MISTRAL_TIMEOUT:30s}
app.nutrition-scanner.max-image-bytes=${MISTRAL_MAX_IMAGE_BYTES:10485760}
app.nutrition-scanner.max-images=${MISTRAL_MAX_IMAGES:3}
app.nutrition-scanner.validate-image-signature=${MISTRAL_VALIDATE_IMAGE_SIGNATURE:false}
app.nutrition-scanner.max-response-bytes=${MISTRAL_MAX_RESPONSE_BYTES:5242880}
