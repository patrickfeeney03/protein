## SQLite
spring.datasource.url=${SQLITE_JDBC_URL:jdbc:sqlite:/home/patrick/code/protein/protein/data/app-dev.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# create and drop table, good for testing, production set to none or comment it
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update

logging.level.com.example.demo=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:4200/api/auth/google/callback}
app.security.cookies.secure=false
app.security.origin-verification.enabled=false
app.security.origin-verification.enforce=false
app.rate-limit.require-trusted-proxy=false
